<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AkiLab Linux TTY (AS4242423143)</title>
  
  <link rel="stylesheet" href="./vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="./css/terminal.css" />
  <script>
    // 清理历史注册的旧 SW（其 cache-first 会拦截 rootfs.dat 导致更新失效）；
    // 服务端已直接下发 COOP/COEP 头，SW 不再需要
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    // 服务端已直接下发 COOP/COEP 头时跳过 sw 注册（避免首访 reload）；
    // 否则注册 coi-serviceworker 兜底（静态托管无隔离头场景）
    if (!window.crossOriginIsolated) {
      var s = document.createElement('script');
      s.src = 'coi-serviceworker.min.js';
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <!-- 纯终端容器：全屏无边框、无导航栏、原汁原味 Linux Console -->
  <div id="terminal"></div>

  <script type="module">
    import { FitAddon, Terminal } from "./vendor/xterm/dist.js";

    // 1. 同步首屏第 0 毫秒立即初始化并挂载纯正 Linux TTY xterm 视口
    const term = new Terminal({
      convertEol: true,
      fontFamily: "Monaco, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace",
      fontSize: 14,
      letterSpacing: 0,
      lineHeight: 1.2,
      cursorBlink: true,
      cursorStyle: 'block',
      theme: {
        background: "#000000",
        foreground: "#cccccc",
        cursor: "#ffffff",
        cursorAccent: "#000000",
        selectionBackground: "#333333",
        black: "#000000",
        red: "#cd0000",
        green: "#00cd00",
        yellow: "#cdcd00",
        blue: "#0000ee",
        magenta: "#cd00cd",
        cyan: "#00cdcd",
        white: "#e5e5e5",
        brightBlack: "#7f7f7f",
        brightRed: "#ff0000",
        brightGreen: "#00ff00",
        brightYellow: "#ffff00",
        brightBlue: "#5c5cff",
        brightMagenta: "#ff00ff",
        brightCyan: "#00ffff",
        brightWhite: "#ffffff"
      }
    });

    const termFit = new FitAddon();
    term.loadAddon(termFit);
    term.open(document.getElementById("terminal"));
    termFit.fit();
    term.focus();
    window.addEventListener("resize", () => termFit.fit());
    window.term = term;

    // U6: Register OSC handler for startx automatic GUI redirect
    if (term.parser && term.parser.registerOscHandler) {
      term.parser.registerOscHandler(1337, (data) => {
        if (data && data.startsWith('OpenUrl=')) {
          const target = data.slice(8).trim();
          window.location.href = target || '/gui/';
          return true;
        }
        return false;
      });
      term.parser.registerOscHandler(50, (data) => {
        if (data && data.startsWith('AgyJump=')) {
          const target = data.slice(8).trim();
          window.location.href = target || '/gui/';
          return true;
        }
        return false;
      });
    }

    // 早期引导日志
    term.writeln("\x1b[90m[  0.000000] Initializing AkiLab DN42 WebAssembly Linux 6.1 Kernel...\x1b[0m");
    if (window.crossOriginIsolated) {
      term.writeln("\x1b[32m[✓] Cross-Origin Isolation: Active (vCPU Worker threads enabled)\x1b[0m");
    } else {
      term.writeln("\x1b[33m[*] Cross-Origin Isolation: Registering ServiceWorker fallback...\x1b[0m");
    }
    term.writeln("\x1b[90m[*] Shortcuts: Copy: Ctrl+C (select) · Paste: Ctrl+V · Interrupt: Ctrl+C (no select)\x1b[0m");

    // --- 📋 剪贴板与原生快捷键深度适配 ---
    let stdinController = null;

    function sanitizePasteText(text) {
      if (!text || typeof text !== 'string') return '';
      // 剥离末尾换行，保留内部多行换行
      return text.replace(/[\r\n]+$/, '');
    }

    window.sendTerminalInput = (text) => {
      if (stdinController && text) {
        stdinController.enqueue(text);
      }
    };

    // 1. 自定义键盘快捷键拦截器 (快捷键定案)
    term.attachCustomKeyEventHandler((event) => {
      // (A) Ctrl+Shift+C: 强制复制当前选区，无条件拦截
      if (event.ctrlKey && event.shiftKey && (event.key === 'c' || event.key === 'C')) {
        if (term.hasSelection()) {
          const selection = term.getSelection();
          if (selection) {
            navigator.clipboard.writeText(selection).catch(() => {});
          }
        }
        return false; // 无条件拦截
      }

      // (B) Ctrl+C: 如果屏幕上有选中文本，则执行复制并拦截（^C 不进终端）；无选区则放行（^C 进入终端中断输入）
      if (event.ctrlKey && (event.key === 'c' || event.key === 'C') && !event.shiftKey && !event.altKey) {
        if (term.hasSelection()) {
          const selection = term.getSelection();
          if (selection) {
            navigator.clipboard.writeText(selection).catch(() => {});
          }
          return false; // 拦截！不向 Linux 发送 ^C
        }
        return true; // 放行！^C 进入终端中断当前输入
      }

      // (C) Ctrl+V / Ctrl+Shift+V / Shift+Insert: 拦截按键本身，交由 paste 事件单路径处理（防双份粘贴）
      if (
        (event.ctrlKey && (event.key === 'v' || event.key === 'V')) ||
        (event.ctrlKey && event.shiftKey && (event.key === 'v' || event.key === 'V')) ||
        (event.shiftKey && event.key === 'Insert')
      ) {
        return false; // 彻底拦截按键事件，防止 xterm 注入原始字符
      }

      // (D) 彻底放行 F 区功能键 (F1 ~ F12) 与浏览器原生快捷键 (F5/Ctrl+F5刷新、F12控制台、F11全屏、Ctrl+R等)
      if (/^F([1-9]|1[0-2])$/.test(event.key)) {
        if (event.key === 'F5' && event.type === 'keydown') {
          window.location.reload();
        }
        return false;
      }

      if (event.ctrlKey && (event.key === 'r' || event.key === 'R')) {
        return false; // 放行 Ctrl+R 刷新
      }

      if (event.ctrlKey && (event.key === 'w' || event.key === 'W')) {
        return false; // 放行 Ctrl+W 关闭标签
      }

      return true;
    });

    const terminalElement = document.getElementById("terminal");

    // 2. 浏览器原生 paste 事件监听器（单一可信粘贴路径）
    window.addEventListener("paste", (e) => {
      e.preventDefault();
      const clipboardData = e.clipboardData || window.clipboardData;
      const text = clipboardData ? clipboardData.getData('text') : '';
      if (text && window.sendTerminalInput) {
        const sanitized = sanitizePasteText(text);
        if (sanitized) {
          window.sendTerminalInput(sanitized);
        }
      }
    });

    // 3. 鼠标右键：彻底砍除所有行为（不粘贴、不复制、不弹菜单）
    terminalElement.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });

    // 2. 异步动态加载 WASM 机器与内核驱动
    async function bootNativeLinux() {
      let linuxDist, fetchNetworkMod, hostfsMod;
      // 带时间戳绕过 immutable 缓存：cli 资源无构建 hash，更新必须即时生效
      const BUILD = Date.now();
      try {
        linuxDist = await import(`./vendor/linux/dist/index.js?v=${BUILD}`);
        fetchNetworkMod = await import(`./fetch-network.js?v=${BUILD}`);
        try {
          hostfsMod = await import(`./hostfs.js?v=${BUILD}`);
        } catch (e) {}
      } catch (err) {
        term.writeln(`\x1b[31m[-] Failed to load Linux driver modules: ${err.message}\x1b[0m`);
        return;
      }

      const { consoleDevice, entropyDevice, spawnMachine, ethernetDevice, ethernetNetwork, fileSystemDevice } = linuxDist;
      const { fetchInternetGateway } = fetchNetworkMod;
      const { createHostDirectoryFS, HOSTFS_SUPPORTED } = hostfsMod || {};

      const HOSTFS_TAG = "hostfs";
      const PERSIST_TAG = "persist";
      let hostfs = HOSTFS_SUPPORTED ? createHostDirectoryFS() : null;

      // 持久层：浏览器 OPFS 自动挂载（免授权），供 Linux 侧 rememberMe 会话持久化
      let persistFs = null;
      let opfsDirHandle = null;
      try {
        if (createHostDirectoryFS && navigator.storage && navigator.storage.getDirectory) {
          persistFs = createHostDirectoryFS();
          opfsDirHandle = await navigator.storage.getDirectory();
          await persistFs.attach(opfsDirHandle);
        }
      } catch (e) {
        persistFs = null;
      }

      // 双端同步：宿主暴露 OPFS Token 镜像写入函数
      window.syncTokenToPersist = async (token) => {
        try {
          if (!navigator.storage || !navigator.storage.getDirectory) return;
          const rootDir = opfsDirHandle || await navigator.storage.getDirectory();
          if (token) {
            const dn42Dir = await rootDir.getDirectoryHandle('.dn42', { create: true });
            const fileHandle = await dn42Dir.getFileHandle('token', { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(token);
            await writable.close();
          } else {
            try {
              const dn42Dir = await rootDir.getDirectoryHandle('.dn42');
              await dn42Dir.removeEntry('token').catch(() => {});
              await dn42Dir.removeEntry('asn').catch(() => {});
            } catch {}
          }
        } catch (e) {
          console.warn('OPFS token sync error:', e);
        }
      };

      // 双端同步：宿主暴露 OPFS Token 读取函数
      window.readTokenFromPersist = async () => {
        try {
          if (!navigator.storage || !navigator.storage.getDirectory) return null;
          const rootDir = opfsDirHandle || await navigator.storage.getDirectory();
          const dn42Dir = await rootDir.getDirectoryHandle('.dn42');
          const fileHandle = await dn42Dir.getFileHandle('token');
          const file = await fileHandle.getFile();
          const token = (await file.text()).trim();
          return token || null;
        } catch (e) {
          return null;
        }
      };

      // 宿主启动时：双向对账同步（localStorage <-> OPFS persist）
      try {
        const localToken = localStorage.getItem('dn42_auth_token');
        if (localToken) {
          // localStorage 有 token -> 镜像写入 persist
          await window.syncTokenToPersist(localToken);
        } else {
          // localStorage 无 token -> 从 persist 读取并反向写入 localStorage
          const persistToken = await window.readTokenFromPersist();
          if (persistToken) {
            localStorage.setItem('dn42_auth_token', persistToken);
          }
        }
      } catch (e) {
        console.warn('Token sync on boot warning:', e);
      }

      const stdin = new ReadableStream({
        start(controller) {
          stdinController = controller;
          term.onData((data) => {
            controller.enqueue(data);
          });
        }
      }).pipeThrough(new TextEncoderStream());

      const toTerminal = (data) => new Promise((resolve) => term.write(data, resolve));
      const stdout = new WritableStream({
        write(chunk) {
          return toTerminal(chunk);
        }
      });

      const ttyConsole = consoleDevice(stdin, stdout);
      const resizeConsole = () => ttyConsole.resize(term.cols, term.rows);
      term.onResize(resizeConsole);
      resizeConsole();

      const bootOut = new WritableStream({
        write(chunk) {
          return toTerminal(new TextEncoder().encode("\x1b[2m" + new TextDecoder().decode(chunk) + "\x1b[0m"));
        }
      });

      term.writeln("\x1b[90m[*] Downloading Root Filesystem (rootfs.dat)...\x1b[0m");

      // 下载根文件系统 rootfs.dat (带时间戳防缓存)
      let initcpio;
      try {
        const res = await fetch(`rootfs.dat?t=${Date.now()}`, { cache: "no-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        initcpio = await res.arrayBuffer();
      } catch (err) {
        term.writeln(`\x1b[31m[-] Failed to load rootfs.dat: ${err.message}\x1b[0m`);
        return;
      }

      const network = ethernetNetwork();
      function randMac() {
        const h = () => Math.floor(Math.random() * 256).toString(16).padStart(2, "0");
        return "02:" + h() + ":" + h() + ":" + h() + ":" + h() + ":" + h();
      }

      try {
        await fetchInternetGateway(network, {
          gatewayIp: "10.0.2.2",
          gatewayMac: randMac(),
          syntheticIp: "203.0.113.1",
          forceHttps: false,
          execPort: 20728,
          fetch: (...args) => {
            const urlStr = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
            // 把发往虚拟网关(10.0.2.2)的请求重写为同源路径：
            // Linux 内视角不变(10.0.2.2:4242)，宿主侧直接打本域 API，零 CORS 问题。
            // cache:no-store —— API 响应绝不能进浏览器缓存（否则认证数据会串）
            const rewritten = urlStr.replace(/^https?:\/\/10\.0\.2\.2(?::\d+)?\//, '/');
            const resPromise = fetch(rewritten, { ...(args[1] || {}), cache: 'no-store' });

            // 双端同步：网关拦截 CLI 认证响应并镜像到 localStorage
            resPromise.then(async (res) => {
              if (res.ok && (
                rewritten.includes('/api/auth/login-password') ||
                rewritten.includes('/api/auth/verify-signature') ||
                rewritten.includes('/api/auth/verify-ssh')
              )) {
                try {
                  const clone = res.clone();
                  const data = await clone.json();
                  if (data && data.success && data.data && data.data.token) {
                    localStorage.setItem('dn42_auth_token', data.data.token);
                  }
                } catch {}
              }
              if (rewritten.includes('/api/auth/logout')) {
                localStorage.removeItem('dn42_auth_token');
              }
            }).catch(() => {});

            return resPromise;
          },
          debug: false
        });
        term.writeln("\x1b[32m[✓] Fetch Network Gateway: Online (10.0.2.2 bridge)\x1b[0m");
      } catch (err) {
        term.writeln(`\x1b[31m[-] Gateway init FAILED: ${err && err.message}\x1b[0m`);
        console.warn("Gateway init warning:", err);
      }

      const devices = [
        ttyConsole,
        entropyDevice(),
        ethernetDevice(network)
      ];
      if (hostfs) {
        devices.push(fileSystemDevice(hostfs.fs, { tag: HOSTFS_TAG, cache: true }));
      }
      if (persistFs) {
        devices.push(fileSystemDevice(persistFs.fs, { tag: PERSIST_TAG, cache: true }));
      }

      term.writeln("\x1b[32m[✓] Spawning Linux 6.1 WASM Virtual Machine...\x1b[0m\r\n");
      term.writeln("\x1b[90m[*] First boot compiles the 4.3MB kernel, may take a few seconds...\x1b[0m");
      try {
        // 30s 超时自愈：spawn 挂起时提示并自动重载（间歇性 worker 初始化卡顿）
        const spawnTimer = setTimeout(() => {
          term.writeln("\x1b[33m[*] Kernel spawn timed out, auto-reloading...\x1b[0m");
          setTimeout(() => window.location.reload(), 1500);
        }, 30000);
        const machine = await spawnMachine({
          cpus: Math.min(4, navigator.hardwareConcurrency || 2),
          cmdline: "quiet",
          devices,
          initcpio: new Uint8Array(initcpio),
        });
        clearTimeout(spawnTimer);

        machine.bootConsole.pipeTo(bootOut);
        termFit.fit();
        term.focus();
      } catch (err) {
        term.writeln(`\x1b[31m[-] Linux Kernel Boot Error: ${err.message}\x1b[0m`);
      }
    }

    bootNativeLinux().catch((err) => {
      term.writeln(`\x1b[31m[-] System Error: ${err.message}\x1b[0m`);
    });
  </script>
</body>
</html>
